name: TicaretKoruma APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle assembleDebug

      - name: APK dosyasini hazirla
        uses: actions/upload-artifact@v4
        with:
          name: TicaretKoruma-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
